<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Passaí — Gráficos da modelagem</title>
<style>
body { margin: 0; padding: 32px; background: #f3f2f6; color: #25242a; font-family: Arial, sans-serif; }
h1 { margin: 0 0 8px; text-align: center; }
p { margin: 0 0 28px; text-align: center; color: #66636b; }
main { display: grid; grid-template-columns: repeat(auto-fit, minmax(520px, 1fr)); gap: 22px; }
article { background: white; border: 1px solid #dddbe2; border-radius: 14px; overflow: hidden; box-shadow: 0 8px 24px #25242a14; }
img { display: block; width: 100%; height: auto; }
@media (max-width: 620px) { body { padding: 14px; } main { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<h1>Passaí — Modelagem matemática</h1>
<p>Limites, derivadas, integrais, valor médio e otimização de cenários simulados</p>
<main><article><img src="01_tempo_por_velocidade.svg" alt="01_tempo_por_velocidade"></article>
<article><img src="02_derivadas_e_sensibilidade.svg" alt="02_derivadas_e_sensibilidade"></article>
<article><img src="03_integral_chegadas_acumuladas.svg" alt="03_integral_chegadas_acumuladas"></article>
<article><img src="04_mapa_decisao.svg" alt="04_mapa_decisao"></article>
<article><img src="05_tempo_medio_por_integral.svg" alt="05_tempo_medio_por_integral"></article>
<article><img src="06_otimizacao_extensao.svg" alt="06_otimizacao_extensao"></article></main>
</body>
</html>
